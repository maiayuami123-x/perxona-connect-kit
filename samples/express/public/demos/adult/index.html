<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>今天吃了什麼</title>
    <style>
      :root {
        --bg: #0f1115; --panel: #181b22; --panel2: #20242d;
        --line: #2c313c; --text: #eef0f5; --dim: #959cad;
        --accent: #4fa87c; --accent2: #3d8a66;
        --warn: #d98b3c; --over: #d9604f; --user: #2f4a6b;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: "PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
        font-size: 16px; line-height: 1.65;
        display: flex; flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .wrap { width: 100%; max-width: 560px; margin: 0 auto;
              display: flex; flex-direction: column; flex: 1; min-height: 0; }
      button { font: inherit; }

      /* ── setup ── */
      #setup { padding: 22px 18px 40px; overflow-y: auto; }
      #setup h1 { font-size: 24px; margin: 6px 0 4px; }
      #setup .sub { color: var(--dim); font-size: 14px; margin: 0 0 20px; }
      .field { margin-bottom: 15px; }
      .field label { display: block; font-size: 14px; color: var(--dim); margin-bottom: 6px; }
      .field input, .field select {
        width: 100%; height: 50px; font-size: 17px; padding: 0 13px;
        border-radius: 11px; border: 1.5px solid var(--line);
        background: var(--panel); color: var(--text);
      }
      .row2 { display: flex; gap: 11px; }
      .row2 .field { flex: 1; }
      .seg { display: flex; gap: 8px; }
      .seg button {
        flex: 1; height: 50px; border-radius: 11px; font-size: 15px;
        border: 1.5px solid var(--line); background: var(--panel); color: var(--dim);
      }
      .seg button[aria-pressed="true"] {
        border-color: var(--accent); background: #1d3329; color: var(--text); font-weight: 600;
      }
      .primary {
        width: 100%; height: 54px; margin-top: 8px; border: none;
        border-radius: 12px; background: var(--accent); color: #fff;
        font-size: 17px; font-weight: 600;
      }
      .primary:active { background: var(--accent2); }
      .hint { color: var(--dim); font-size: 13px; margin-top: 12px; line-height: 1.6; }
      #preview { background: var(--panel); border-radius: 12px; padding: 13px 15px;
                 margin: 4px 0 14px; font-size: 14px; color: var(--dim); display: none; }
      #preview b { color: var(--text); font-size: 17px; }

      /* ── dashboard ── */
      #main { display: none; flex-direction: column; flex: 1; min-height: 0; }
      .top { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
      .kcal { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
      .kcal .big { font-size: 30px; font-weight: 650; letter-spacing: -0.5px; }
      .kcal .goal { color: var(--dim); font-size: 14px; }
      .bar { height: 9px; border-radius: 5px; background: var(--panel2); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s; }
      .bar.warn i { background: var(--warn); } .bar.over i { background: var(--over); }
      .macros { display: flex; gap: 9px; margin-top: 11px; }
      .macro { flex: 1; }
      .macro .n { font-size: 12px; color: var(--dim); display: flex;
                  justify-content: space-between; margin-bottom: 4px; }
      .macro .bar { height: 5px; }
      .settings-btn { background: none; border: none; color: var(--dim);
                      font-size: 13px; padding: 2px 0; text-decoration: underline; }

      /* ── log + chat ── */
      #log { flex: 1; overflow-y: auto; padding: 14px 16px 6px; margin: 0;
             list-style: none; display: flex; flex-direction: column; gap: 10px;
             -webkit-overflow-scrolling: touch; }
      #log li { max-width: 90%; padding: 11px 14px; border-radius: 15px;
                background: var(--panel); white-space: pre-wrap; word-wrap: break-word; }
      #log li.me { align-self: flex-end; background: var(--user); }
      #log li.err { background: #3d2626; }
      #log li.add { align-self: center; max-width: 100%; background: none;
                    color: var(--dim); font-size: 13px; padding: 2px 0; }
      form { display: flex; gap: 9px; padding: 10px 14px 14px;
             border-top: 1px solid var(--line); align-items: center; }
      .cam { flex: none; width: 52px; height: 52px; border-radius: 13px;
             background: var(--panel); border: 1.5px solid var(--line);
             display: flex; align-items: center; justify-content: center; font-size: 21px; }
      .cam input { position: absolute; width: 1px; height: 1px; opacity: 0; }
      #msg { flex: 1; min-width: 0; height: 52px; font-size: 16px; border-radius: 13px;
             border: 1.5px solid var(--line); background: var(--panel);
             color: var(--text); padding: 0 14px; }
      #send { flex: none; width: 64px; height: 52px; border: none; border-radius: 13px;
              background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; }
      button:disabled, .cam.off { opacity: .45; }
      .foot { text-align: center; color: #666d7d; font-size: 12px; padding: 0 16px 9px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- ── first run: profile ── -->
      <section id="setup">
        <h1>今天吃了什麼</h1>
        <p class="sub">先設定一次,之後打開就能直接用。資料只存在這台裝置。</p>

        <div class="row2">
          <div class="field"><label for="age">年齡</label>
            <input id="age" type="number" inputmode="numeric" placeholder="38" /></div>
          <div class="field"><label for="sex">生理性別</label>
            <select id="sex"><option value="male">男性</option><option value="female">女性</option></select></div>
        </div>
        <div class="row2">
          <div class="field"><label for="height">身高 (公分)</label>
            <input id="height" type="number" inputmode="numeric" placeholder="175" /></div>
          <div class="field"><label for="weight">體重 (公斤)</label>
            <input id="weight" type="number" inputmode="decimal" placeholder="75" /></div>
        </div>

        <div class="field">
          <label for="activity">活動量</label>
          <select id="activity">
            <option value="sedentary">久坐,幾乎不運動</option>
            <option value="light" selected>輕度,每週運動一到三次</option>
            <option value="moderate">中度,每週運動三到五次</option>
            <option value="active">高度,每週運動六次以上或勞力工作</option>
          </select>
        </div>

        <div class="field">
          <label>目標</label>
          <div class="seg" id="goalSeg">
            <button type="button" data-goal="maintain" aria-pressed="true">維持</button>
            <button type="button" data-goal="cut" aria-pressed="false">減脂</button>
            <button type="button" data-goal="bulk" aria-pressed="false">增肌</button>
          </div>
        </div>

        <div id="preview"></div>
        <button class="primary" id="saveBtn" type="button">開始使用</button>
        <p class="hint">熱量以 Mifflin-St Jeor 公式推算,是估計值不是處方。
          有慢性病、正在服藥或由醫師、營養師安排飲食的人,請以他們的指示為準。</p>
      </section>

      <!-- ── daily dashboard ── -->
      <section id="main">
        <div class="top">
          <div class="kcal">
            <span class="big"><span id="kcalNow">0</span> <span style="font-size:15px;color:var(--dim)">大卡</span></span>
            <span class="goal">目標 <span id="kcalGoal">—</span>　<button class="settings-btn" id="editBtn" type="button">設定</button></span>
          </div>
          <div class="bar" id="kcalBar"><i></i></div>
          <div class="macros" id="macros"></div>
        </div>

        <ul id="log"></ul>

        <form id="form">
          <label class="cam" id="cam" title="拍照">📷
            <input id="photo" type="file" accept="image/*" capture="environment" aria-label="拍食物照片" />
          </label>
          <input id="msg" type="text" autocomplete="off" placeholder="早餐吃了蛋餅配大冰奶" aria-label="訊息" />
          <button id="send" type="submit">送出</button>
        </form>
        <div class="foot">估計值僅供參考,非醫療建議</div>
      </section>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const PROFILE_KEY = "dietProfile";
      const DAY_KEY = "dietDay";
      const MACROS = [
        ["protein", "蛋白質", "g"],
        ["carb", "碳水", "g"],
        ["fat", "脂肪", "g"],
        ["sodium", "鈉", "mg"],
      ];
      const BLANK = { kcal: 0, protein: 0, fat: 0, carb: 0, sugar: 0, fiber: 0, sodium: 0 };

      const store = {
        get(k, fallback) {
          try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; }
        },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
      };
      const today = () => new Date().toLocaleDateString("en-CA"); // local YYYY-MM-DD

      let profile = store.get(PROFILE_KEY, null);
      let targets = null;
      let history = [];

      /** The day's running total, reset automatically when the date rolls over. */
      function loadDay() {
        const d = store.get(DAY_KEY, null);
        if (!d || d.date !== today()) return { date: today(), totals: { ...BLANK }, items: [] };
        return d;
      }
      let day = loadDay();

      // ── setup screen ─────────────────────────────────────────────────────
      let goal = "maintain";
      $("goalSeg").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-goal]");
        if (!b) return;
        goal = b.dataset.goal;
        for (const x of $("goalSeg").children) x.setAttribute("aria-pressed", String(x === b));
        refreshPreview();
      });

      const readForm = () => ({
        sex: $("sex").value, age: +$("age").value,
        height: +$("height").value, weight: +$("weight").value,
        activity: $("activity").value, goal,
      });

      async function fetchTargets(p) {
        const res = await fetch("/api/targets", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ profile: p }),
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.statusText);
        return (await res.json()).targets;
      }

      let previewTimer;
      function refreshPreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(async () => {
          const p = readForm();
          if (!(p.age > 0 && p.height > 0 && p.weight > 0)) { $("preview").style.display = "none"; return; }
          try {
            const t = await fetchTargets(p);
            $("preview").style.display = "block";
            $("preview").innerHTML =
              `每日目標 <b>${t.kcal}</b> 大卡　蛋白質 <b>${t.protein}</b> 公克<br>` +
              `<span style="font-size:13px">基礎代謝 ${t.bmr}・每日消耗 ${t.tdee}・${t.goal}</span>`;
          } catch { $("preview").style.display = "none"; }
        }, 350);
      }
      for (const id of ["age", "sex", "height", "weight", "activity"])
        $(id).addEventListener("input", refreshPreview);

      $("saveBtn").addEventListener("click", async () => {
        const p = readForm();
        if (!(p.age > 0 && p.height > 0 && p.weight > 0)) {
          alert("年齡、身高、體重都要填喔"); return;
        }
        profile = p;
        store.set(PROFILE_KEY, p);
        await enterMain();
      });

      $("editBtn").addEventListener("click", () => {
        $("main").style.display = "none";
        $("setup").style.display = "block";
        if (profile) {
          $("age").value = profile.age; $("sex").value = profile.sex;
          $("height").value = profile.height; $("weight").value = profile.weight;
          $("activity").value = profile.activity;
          goal = profile.goal;
          for (const x of $("goalSeg").children)
            x.setAttribute("aria-pressed", String(x.dataset.goal === goal));
          refreshPreview();
        }
      });

      // ── dashboard ────────────────────────────────────────────────────────
      function paint() {
        if (!targets) return;
        const t = day.totals;
        $("kcalNow").textContent = Math.round(t.kcal);
        $("kcalGoal").textContent = targets.kcal;
        setBar($("kcalBar"), t.kcal, targets.kcal);
        $("macros").innerHTML = MACROS.map(([k, label, unit]) =>
          `<div class="macro"><div class="n"><span>${label}</span>` +
          `<span>${Math.round(t[k])}/${targets[k]}${unit}</span></div>` +
          `<div class="bar" data-k="${k}"><i></i></div></div>`).join("");
        for (const el of $("macros").querySelectorAll(".bar"))
          setBar(el, t[el.dataset.k], targets[el.dataset.k]);
      }
      function setBar(el, now, goalVal) {
        const pct = goalVal ? (now / goalVal) * 100 : 0;
        el.querySelector("i").style.width = Math.min(100, pct) + "%";
        el.classList.toggle("warn", pct > 85 && pct <= 100);
        el.classList.toggle("over", pct > 100);
      }

      function say(text, cls) {
        const li = document.createElement("li");
        if (cls) li.className = cls;
        li.textContent = text;
        $("log").append(li);
        $("log").scrollTop = $("log").scrollHeight;
        return li;
      }
      function busy(on) {
        $("send").disabled = on; $("msg").disabled = on;
        $("photo").disabled = on; $("cam").classList.toggle("off", on);
      }

      /** Adds items to today's running total and shows what was counted. */
      function record(items) {
        if (!items?.length) return;
        for (const it of items) {
          for (const k of Object.keys(BLANK)) day.totals[k] += Number(it[k]) || 0;
          day.items.push({ ...it, at: Date.now() });
        }
        store.set(DAY_KEY, day);
        say("已記錄:" + items.map((i) => `${i.name} ${Math.round(i.kcal)} 大卡`).join("、"), "add");
        paint();
      }

      async function ask(text, shown = text) {
        say(shown, "me");
        history.push({ role: "user", text });
        busy(true);
        try {
          const res = await fetch("/api/coach", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              profile, consumed: day.totals,
              messages: history.slice(-16),
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.reply) throw new Error(data.error ?? res.statusText);
          say(data.reply);
          history.push({ role: "assistant", text: data.reply });
          record(data.items);
          if (data.targets) { targets = data.targets; paint(); }
        } catch (err) {
          if (history.at(-1)?.role === "user") history.pop();
          say("剛剛沒連上,再試一次好嗎?", "err");
          console.error(err);
        } finally {
          busy(false);
          $("msg").focus();
        }
      }

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const t = $("msg").value.trim();
        if (!t) return;
        $("msg").value = "";
        await ask(t);
      });

      const readFile = (f) => new Promise((ok, no) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result));
        r.onerror = () => no(r.error);
        r.readAsDataURL(f);
      });

      $("photo").addEventListener("change", async () => {
        const file = $("photo").files?.[0];
        if (!file) return;
        $("photo").value = "";
        busy(true);
        const pending = say("📷 分析照片中…", "me");
        try {
          const res = await fetch("/api/analyze-food", {
            method: "POST", headers: { "Content-Type": "text/plain" },
            body: await readFile(file),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.description) throw new Error(data.error ?? res.statusText);
          pending.remove();
          if (data.description.includes("沒有看到食物")) {
            say("這張看不出來吃了什麼,直接打字告訴我吧。"); return;
          }
          busy(false);
          await ask(`我剛吃了:${data.description}`, `📷 ${data.description}`);
        } catch (err) {
          pending.remove();
          say("這張照片分析失敗,直接打字告訴我吧。", "err");
          console.error(err);
        } finally { busy(false); }
      });

      // ── boot ─────────────────────────────────────────────────────────────
      async function enterMain() {
        try { targets = await fetchTargets(profile); }
        catch (err) { alert("算不出目標,檢查一下數字?"); console.error(err); return; }
        $("setup").style.display = "none";
        $("main").style.display = "flex";
        day = loadDay();
        paint();
        if (!$("log").children.length) {
          const eaten = day.items.length;
          say(eaten
            ? `今天已經記了 ${eaten} 筆,還剩 ${Math.max(0, targets.kcal - Math.round(day.totals.kcal))} 大卡的額度。繼續跟我說你吃了什麼。`
            : "跟我說你今天吃了什麼,或拍張照片。我會幫你算進今天的額度裡。");
        }
      }

      if (profile) enterMain();
      else $("setup").style.display = "block";
    </script>
  </body>
</html>
